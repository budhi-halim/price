<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Price Calculator</h1>
    <div class="darkmode-toggle">
      <label class="switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Dark Mode</span>
    </div>
  </header>

  <div class="container">
    <div class="rate-display">
      Current rate:
      <span id="rate-value">-</span>
      →
      <span id="buffered-rate-value">-</span>
    </div>

    <div id="error-message" class="hidden"></div>

    <div class="table-container">
      <div class="table-wrapper">
        <table id="price-table">
          <thead>
            <tr>
              <th colspan="2"><div class="header-bg">Bottom Price</div></th>
              <th rowspan="3"><div class="header-bg">Year</div></th>
              <th colspan="4"><div class="header-bg">Price</div></th>
            </tr>
            <tr>
              <th rowspan="2"><div class="header-bg">USD</div></th>
              <th rowspan="2"><div class="header-bg">IDR</div></th>
              <th colspan="2"><div class="header-bg">Spices & Powders</div></th>
              <th colspan="2"><div class="header-bg">Seasoning Blends</div></th>
            </tr>
            <tr>
              <th><div class="header-bg">USD</div></th>
              <th><div class="header-bg">IDR</div></th>
              <th><div class="header-bg">USD</div></th>
              <th><div class="header-bg">IDR</div></th>
            </tr>
          </thead>
          <tbody>
            <!-- Rows will be generated here -->
          </tbody>
        </table>
      </div>
    </div>

    <button id="calculate-btn">Calculate</button>
  </div>

  <button id="scrollTopBtn"></button>
  <div id="alert" class="alert"></div>

  <script src="js/script.js"></script>
</body>
</html>
